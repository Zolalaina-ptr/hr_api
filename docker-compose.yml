services:
  app:
    build: .
    ports: ['8000:8000']
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: hr_api
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: redis
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U postgres -d hr_api'], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
volumes:
  postgres_data:
  redis_data:
