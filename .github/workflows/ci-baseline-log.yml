name: CI Baseline Log
on:
  push:
    branches: [arena/01a08003-hr-api]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hr_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hr_api_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Install + test (capture everything)
        run: |
          {
            echo "===== PHP ====="
            php -v
            echo "===== COMPOSER INSTALL ====="
            composer install --no-interaction --no-progress 2>&1
            echo "===== composer install exit: $? ====="
            if [ -d vendor ]; then
              cp .env.example .env 2>/dev/null || true
              php artisan key:generate 2>&1 || true
              echo "===== MIGRATE FRESH ====="
              php artisan migrate:fresh --force 2>&1
              echo "===== migrate fresh exit: $? ====="
              echo "===== TESTS ====="
              php artisan test 2>&1
              echo "===== tests exit: $? ====="
            else
              echo "!!! VENDOR MISSING — composer install failed, skipping tests"
            fi
          } > /tmp/ci-test.log 2>&1 || true
          echo "--- log size: $(wc -c < /tmp/ci-test.log) bytes ---"

      - name: Exfiltrate log (check-run + git tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG=/tmp/ci-test.log
          # sanitized full log for the tag
          tr -d '\000' < "$LOG" 2>/dev/null | iconv -f UTF-8 -t UTF-8 -c > /tmp/full.log
          {
            echo "==== baseline diagnostics $(date -u) ===="
            echo "repo=${GITHUB_REPOSITORY} sha=${GITHUB_SHA}"
            echo "GH_TOKEN set: $([ -n "$GH_TOKEN" ] && echo yes || echo NO)"
            echo "jq: $(jq --version 2>&1) | curl: $(curl --version 2>&1 | head -1)"
            echo "log file: $(wc -c < /tmp/full.log 2>/dev/null || echo MISSING) bytes"
          } > /tmp/diag.txt
          # --- channel 1: check-run (small, fixed + head of log)
          { head -c 8000 /tmp/full.log; } >> /tmp/diag.txt
          tr -d '\000' < /tmp/diag.txt | iconv -f UTF-8 -t UTF-8 -c > /tmp/diag2.txt && mv /tmp/diag2.txt /tmp/diag.txt
          jq -n --rawfile s /tmp/diag.txt --arg sha "$GITHUB_SHA" \
            '{name:"baseline-diag", head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:"diag", summary:$s}}' > /tmp/check.json 2>/tmp/jq.err
          echo "jq check.json: $(cat /tmp/jq.err 2>/dev/null) size=$(wc -c < /tmp/check.json)"
          CC=$(curl -s -o /tmp/check_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/check.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs")
          echo "check-run HTTP $CC: $(head -c 300 /tmp/check_resp.json)"
          # --- channel 2: git tag carrying the full log (always)
          git config user.name "baseline-diag"
          git config user.email "baseline-diag@users.noreply.github.com"
          TAG="ci-diag-${GITHUB_SHA::8}"
          BLOB=$(git hash-object -w /tmp/full.log)
          TREE=$(printf '100644 blob %s\nci-test.log\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "ci diag ${GITHUB_SHA::7}")
          git push -f origin "${COMMIT}:refs/tags/${TAG}" 2>&1
          echo "tag ${TAG} pushed (commit ${COMMIT::7})"
          exit 0
