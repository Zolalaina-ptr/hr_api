name: CI Baseline Log
on:
  push:
    branches: [arena/01a08003-hr-api]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hr_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hr_api_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Install + test (capture everything)
        run: |
          {
            echo "===== PHP ====="
            php -v
            echo "===== COMPOSER INSTALL ====="
            composer install --no-interaction --no-progress 2>&1
            echo "===== composer install exit: $? ====="
            if [ -d vendor ]; then
              cp .env.example .env 2>/dev/null || true
              php artisan key:generate 2>&1 || true
              echo "===== MIGRATE FRESH ====="
              php artisan migrate:fresh --force 2>&1
              echo "===== migrate fresh exit: $? ====="
              echo "===== TESTS ====="
              php artisan test 2>&1
              echo "===== tests exit: $? ====="
            else
              echo "!!! VENDOR MISSING — composer install failed, skipping tests"
            fi
          } > /tmp/ci-test.log 2>&1 || true
          echo "--- log size: $(wc -c < /tmp/ci-test.log) bytes ---"

      - name: Post log to issue #2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/2/comments"
          CHECKS_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs"
          post() { # $1 = markdown file
            jq -n --rawfile body "$1" '{body: $body}' > /tmp/payload.json 2>/tmp/jq.err
            if [ $? -ne 0 ]; then echo "jq failed on $1: $(head -c 300 /tmp/jq.err)" >> /tmp/diag.txt; return 1; fi
            curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              --data @/tmp/payload.json "$API"
          }
          DIAG="==== baseline diagnostics $(date -u) ====\n"
          echo "repo=${GITHUB_REPOSITORY} sha=${GITHUB_SHA::7}" >> /tmp/diag.txt
          echo "GH_TOKEN set: $([ -n "$GH_TOKEN" ] && echo yes || echo NO)" >> /tmp/diag.txt
          echo "jq: $(jq --version 2>&1) | curl: $(curl --version 2>&1 | head -1)" >> /tmp/diag.txt
          # 1) tiny post test
          echo "DIAG tiny comment test [${GITHUB_SHA::7}]" > /tmp/tiny.md
          TINY_CODE=$(post /tmp/tiny.md)
          echo "tiny post => HTTP $TINY_CODE resp=$(head -c 300 /tmp/resp.json)" >> /tmp/diag.txt
          # 2) large post test (100 KB of 'x')
          head -c 100000 /dev/zero | tr '\0' 'x' > /tmp/big.md
          BIG_CODE=$(post /tmp/big.md)
          echo "big post (100KB) => HTTP $BIG_CODE resp=$(head -c 300 /tmp/resp.json)" >> /tmp/diag.txt
          # 3) check-run creation test (diagnostic exfiltration channel)
          jq -n --arg s "$(head -c 10000 /tmp/diag.txt)" \
            --arg sha "$GITHUB_SHA" \
            '{name:"baseline-diag", head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:"diag", summary:$s}}' > /tmp/check.json
          CHECK_CODE=$(curl -s -o /tmp/check_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/check.json "$CHECKS_API")
          echo "check-run create => HTTP $CHECK_CODE resp=$(head -c 300 /tmp/check_resp.json)" >> /tmp/diag.txt
          # refresh check-run summary with final diag after main loop (see below)
          echo "=== diag pre-loop ===" >> /tmp/diag.txt
          LOG=/tmp/ci-test.log
          tail -c 200000 "$LOG" 2>/dev/null | tr -d '\000' | iconv -f UTF-8 -t UTF-8 -c > /tmp/ci-test-tail.log
          SIZE=$(wc -c < /tmp/ci-test-tail.log)
          CHUNK=60000
          TOTAL_FULL=$(( (SIZE + CHUNK - 1) / CHUNK ))
          TOTAL=$TOTAL_FULL
          if [ "$TOTAL" -gt 3 ]; then TOTAL=3; fi
          START=$(( (TOTAL_FULL - TOTAL) * CHUNK ))
          OK=0; FAIL=0; LASTERR=""
          for ((i=0; i<TOTAL; i++)); do
            OFFSET=$(( START + i * CHUNK ))
            {
              echo "**part $((i+1))/$TOTAL [${GITHUB_SHA::7}] $(date -u +%H:%M:%S UTC)**"
              echo '```'
              tail -c +$((OFFSET + 1)) /tmp/ci-test-tail.log | head -c $CHUNK
              echo ''
              echo '```'
            } > /tmp/comment.md
            CODE=$(post /tmp/comment.md)
            if [ "$CODE" = "201" ]; then OK=$((OK+1)); else FAIL=$((FAIL+1)); LASTERR=$(head -c 2000 /tmp/resp.json); fi
          done
          {
            echo "STATUS [${GITHUB_SHA::7}] log_total=$(wc -c < $LOG)B posted_size=$SIZEB ok=$OK fail=$FAIL"
            if [ "$TOTAL_FULL" -gt "$TOTAL" ]; then echo "(log truncated: showing last $((TOTAL * CHUNK)) bytes of $SIZE)"; fi
            if [ "$FAIL" -gt 0 ]; then echo "ERROR:"; echo "$LASTERR"; fi
          } > /tmp/status.md
          post /tmp/status.md > /dev/null || true
          echo "Posted ok=$OK fail=$FAIL"
          # final diagnostic check-run with full picture
          { echo ""; echo "=== main loop: ok=$OK fail=$FAIL ==="; echo "--- log head ---"; head -c 3000 /tmp/ci-test.log; } >> /tmp/diag.txt
          jq -n --arg s "$(head -c 10000 /tmp/diag.txt)" \
            --arg sha "$GITHUB_SHA" \
            '{name:"baseline-diag", head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:"diag-final", summary:$s}}' > /tmp/check.json
          curl -s -o /tmp/check_resp.json -w "final check-run: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/check.json "$CHECKS_API" || true
          if [ "$OK" -eq 0 ]; then exit 1; fi
          exit 0
